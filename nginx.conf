server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml font/ttf application/manifest+json;

    # Nota: "expires" no pisa a add_header de nivel server; por eso se usa
    # expires en las locations en lugar de add_header Cache-Control.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # El service worker y el HTML nunca deben quedar cacheados por días,
    # o los usuarios no reciben versiones nuevas.
    location = /service-worker.js {
        expires -1;
        try_files $uri =404;
    }

    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }

    # Bundles de Expo con hash en el nombre: seguros de cachear 1 año.
    location ^~ /_expo/static/ {
        expires 1y;
        try_files $uri =404;
    }

    # Resto de estáticos (íconos, fuentes, imágenes)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|ttf|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    # Fallback SPA (equivalente al rewrite de vercel.json)
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
