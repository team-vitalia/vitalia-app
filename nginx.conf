server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Equivalente al rewrite de vercel.json (SPA)
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|ttf|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
